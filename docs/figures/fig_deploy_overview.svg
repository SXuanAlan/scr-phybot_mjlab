<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 730" width="1400" height="730" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="13" fill="#111111">
<defs>
  <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333333"/></marker>
  <marker id="ah-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#777777"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="730" fill="#FFFFFF"/>

<!-- palette: blue = mechanical / hardware, orange = operator, green = control software, yellow = bus -->

<!-- ============ (a) run procedure ============ -->
<text x="25" y="30" font-size="14" font-weight="bold">(a) Run procedure</text>

<!-- CubicTraj formula above step 2 -->
<text x="255" y="44" font-family="Liberation Serif, DejaVu Serif, serif" font-size="15"><tspan font-style="italic">q</tspan>(<tspan font-style="italic">s</tspan>) = <tspan font-style="italic">q</tspan><tspan font-size="11" dy="3">init</tspan><tspan dy="-3"> + (</tspan><tspan font-style="italic">q</tspan><tspan font-size="11" dy="3">ZERO</tspan><tspan dy="-3"> − </tspan><tspan font-style="italic">q</tspan><tspan font-size="11" dy="3">init</tspan><tspan dy="-3">)(3</tspan><tspan font-style="italic">s</tspan><tspan font-size="11" dy="-6">2</tspan><tspan dy="6"> − 2</tspan><tspan font-style="italic">s</tspan><tspan font-size="11" dy="-6">3</tspan><tspan dy="6">),   </tspan><tspan font-style="italic">s</tspan> = <tspan font-style="italic">t</tspan>/<tspan font-style="italic">T</tspan>,  0 ≤ <tspan font-style="italic">s</tspan> ≤ 1</text>
<text x="255" y="64" font-size="12" fill="#444444">CubicTraj interpolation from the power-on pose to ZERO; joint velocity is zero at t = 0 and t = T.</text>
<path d="M355,70 L355,80" fill="none" stroke="#3B6EA5" stroke-width="1.2"/>

<!-- step boxes -->
<g stroke-width="1.3">
  <rect x="25" y="80" width="200" height="76" fill="#DCE8F4" stroke="#3B6EA5"/>
  <rect x="255" y="80" width="200" height="76" fill="#DCE8F4" stroke="#3B6EA5"/>
  <rect x="485" y="80" width="200" height="76" fill="#DCE8F4" stroke="#3B6EA5"/>
  <rect x="715" y="80" width="200" height="76" fill="#FBE6CC" stroke="#C4772B"/>
  <rect x="945" y="80" width="200" height="76" fill="#DDEFD8" stroke="#4C8A3F"/>
  <rect x="1175" y="80" width="200" height="76" fill="#DCE8F4" stroke="#3B6EA5"/>
</g>
<g text-anchor="middle">
  <text x="125" y="111" font-size="14" font-weight="bold">1  Robot on gantry</text>
  <text x="125" y="134" font-size="12" fill="#444444">suspended, feet unloaded</text>
  <text x="355" y="111" font-size="14" font-weight="bold">2  Power on, go to ZERO</text>
  <text x="355" y="134" font-size="12" fill="#444444">cubic trajectory, see above</text>
  <text x="585" y="111" font-size="14" font-weight="bold">3  Lower to ground</text>
  <text x="585" y="134" font-size="12" fill="#444444">feet loaded, gantry slack</text>
  <text x="815" y="111" font-size="14" font-weight="bold">4  Unlock, select task</text>
  <text x="815" y="134" font-size="12" fill="#444444">gamepad, LT + RT</text>
  <text x="1045" y="111" font-size="14" font-weight="bold">5  Task running</text>
  <text x="1045" y="134" font-size="12" fill="#444444">control software, see (b)</text>
  <text x="1275" y="111" font-size="14" font-weight="bold">6  Power off</text>
  <text x="1275" y="134" font-size="12" fill="#444444">return to ZERO first, hoist up</text>
</g>
<g stroke="#333333" stroke-width="1.3" fill="none" marker-end="url(#ah)">
  <path d="M225,118 L249,118"/>
  <path d="M455,118 L479,118"/>
  <path d="M685,118 L709,118"/>
  <path d="M915,118 L939,118"/>
  <path d="M1145,118 L1169,118"/>
</g>

<!-- PHOTO PLACEHOLDERS: replace each group with
     <image href="..." x=".." y="172" width="200" height="180" preserveAspectRatio="xMidYMid slice"/> -->
<g id="photo-slots" stroke="#999999" stroke-width="1" fill="#F3F3F3">
  <rect id="photo-1" x="25" y="172" width="200" height="180"/>
  <rect id="photo-2" x="255" y="172" width="200" height="180"/>
  <rect id="photo-3" x="485" y="172" width="200" height="180"/>
  <rect id="photo-4" x="715" y="172" width="200" height="180"/>
</g>
<g text-anchor="middle" fill="#888888">
  <text x="125" y="258" font-size="13" font-weight="bold">photo</text>
  <text x="125" y="278" font-size="12">robot suspended on gantry</text>
  <text x="355" y="258" font-size="13" font-weight="bold">photo</text>
  <text x="355" y="278" font-size="12">robot at ZERO pose</text>
  <text x="585" y="258" font-size="13" font-weight="bold">photo</text>
  <text x="585" y="278" font-size="12">robot standing on ground</text>
  <text x="815" y="258" font-size="13" font-weight="bold">photo</text>
  <text x="815" y="278" font-size="12">operator with gamepad</text>
</g>

<!-- next-run return path, routed around the left -->
<path d="M1275,156 L1275,372 L12,372 L12,118 L18,118" fill="none" stroke="#777777" stroke-width="1.2" marker-end="url(#ah-g)"/>
<rect x="668" y="364" width="64" height="16" fill="#FFFFFF"/>
<text x="700" y="376" font-size="12" fill="#666666" text-anchor="middle">next run</text>

<!-- ============ (b) control software ============ -->
<text x="25" y="412" font-size="14" font-weight="bold">(b) Control software during step 5</text>

<g stroke-width="1.3">
  <rect x="60" y="430" width="170" height="60" fill="#FBE6CC" stroke="#C4772B"/>
  <rect x="60" y="591" width="170" height="60" fill="#FBE6CC" stroke="#C4772B"/>
  <rect x="300" y="430" width="110" height="221" fill="#FAF1CF" stroke="#A8891F"/>
  <rect x="480" y="430" width="380" height="222" fill="#F1F8EE" stroke="#4C8A3F"/>
  <rect x="480" y="430" width="380" height="34" fill="#C9E3C1" stroke="#4C8A3F"/>
  <rect x="980" y="430" width="130" height="60" fill="#DCE8F4" stroke="#3B6EA5"/>
  <rect x="980" y="591" width="130" height="60" fill="#DCE8F4" stroke="#3B6EA5"/>
  <rect x="1170" y="430" width="150" height="60" fill="#E9E9E9" stroke="#666666"/>
  <rect x="1170" y="591" width="150" height="60" fill="#E9E9E9" stroke="#666666"/>
</g>
<g stroke="#4C8A3F" stroke-width="1" fill="#FFFFFF">
  <rect x="498" y="478" width="344" height="30"/>
  <rect x="498" y="516" width="344" height="44"/>
  <rect x="498" y="568" width="344" height="30"/>
  <rect x="498" y="606" width="344" height="30"/>
</g>

<g text-anchor="middle">
  <text x="145" y="456" font-size="14" font-weight="bold">Gamepad</text>
  <text x="145" y="476" font-size="12" fill="#444444">command publisher</text>
  <text x="145" y="617" font-size="14" font-weight="bold">Web panel</text>
  <text x="145" y="637" font-size="12" fill="#444444">bridge service, read-only</text>

  <text x="355" y="537" font-size="14" font-weight="bold">LCM bus</text>
  <text x="355" y="557" font-size="12" fill="#444444">UDP multicast</text>

  <text x="670" y="452" font-size="14" font-weight="bold">Real-time control loop, 500 Hz</text>

  <text x="1045" y="456" font-size="13" font-weight="bold">Real-robot</text>
  <text x="1045" y="474" font-size="13" font-weight="bold">backend</text>
  <text x="1045" y="617" font-size="13" font-weight="bold">Simulation</text>
  <text x="1045" y="635" font-size="13" font-weight="bold">backend</text>

  <text x="1245" y="456" font-size="14" font-weight="bold">Robot hardware</text>
  <text x="1245" y="476" font-size="12" fill="#444444">motors, sensors</text>
  <text x="1245" y="617" font-size="14" font-weight="bold">MuJoCo model</text>
  <text x="1245" y="637" font-size="12" fill="#444444">physics simulation</text>
</g>

<text x="510" y="498" font-size="13">Safety guards</text>
<text x="510" y="534" font-size="13">Task scheduling</text>
<text x="510" y="551" font-size="12" fill="#444444">tasks: zero, walk, walk_amp, hold</text>
<text x="510" y="588" font-size="13">RL policy inference, 50 Hz</text>
<text x="510" y="626" font-size="13">Telemetry and logging, 50 Hz</text>

<g stroke="#333333" stroke-width="1.3" fill="none" marker-end="url(#ah)">
  <path d="M230,460 L294,460"/>
  <path d="M410,460 L474,460"/>
  <path d="M480,621 L416,621"/>
  <path d="M300,621 L236,621"/>
</g>
<text x="265" y="453" font-size="11" fill="#444444" text-anchor="middle">commands</text>
<text x="445" y="453" font-size="11" fill="#444444" text-anchor="middle">commands</text>
<text x="445" y="614" font-size="11" fill="#444444" text-anchor="middle">telemetry</text>
<text x="265" y="614" font-size="11" fill="#444444" text-anchor="middle">telemetry</text>

<path d="M145,651 L145,688 L670,688 L670,659" fill="none" stroke="#C4772B" stroke-width="1.3" marker-end="url(#ah)"/>
