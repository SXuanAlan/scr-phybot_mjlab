<g stroke="#333333" stroke-width="1.3" fill="none" marker-end="url(#ah)">
  <path d="M1110,460 L1164,460"/>
  <path d="M1110,621 L1164,621"/>
</g>
<text x="1140" y="451" font-size="11" fill="#444444" text-anchor="middle">fieldbus</text>
<text x="1140" y="475" font-size="11" fill="#444444" text-anchor="middle">500 Hz</text>
