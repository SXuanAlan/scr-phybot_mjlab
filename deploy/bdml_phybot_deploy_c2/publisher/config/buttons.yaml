# Button -> DriveCmd.model select-code. Must match the target task's own
# select_code (see tasks/<name>/config/controller.yaml). Looked up at publisher
# startup via load_buttons_config() + BuildButtonBinds() (buttons_config.h),
# which turns every entry below into a ButtonBind: ANY button listed here
# (recognized names: A/B/X/Y/LB/RB/BACK/START, case-insensitive -- see
