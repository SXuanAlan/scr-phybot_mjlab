[project]
name = "scr_phybot_mjab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "amp-rsl-rl==2.2.1",
    "mjlab==1.5.0",
    "mjviser==0.0.14",
    "mujoco==3.10.0",
    "mujoco-warp==3.10.0.1",
    "rsl-rl-lib==5.4.0",
    "warp-lang==1.14.0",
    "trimesh>=4.0",
    "pygame",
]

[project.optional-dependencies]
dev = ["ruff==0.16.8", "pre-commit==4.6.2", "pytest"]

[project.entry-points."mjlab.tasks"]
scr_phybot_mjab = "scr_phybot_mjab.tasks"

[project.scripts]
scr_phybot_mjab-train = "mjlab.scripts.train:main"
scr_phybot_mjab-play = "mjlab.scripts.play:main"
scr_phybot_mjab-list-envs = "mjlab.scripts.list_envs:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"scr_phybot_mjab.assets.microspine" = ["*.npz"]
"scr_phybot_mjab.assets.motions" = ["*.npy", "*.npz", "*.json", "*.txt"]
"scr_phybot_mjab.assets.phybot_c2" = ["*.json", "*.xml", "xml/*.xml", "urdf/*.urdf", "new_meshes/*.stl", "new_meshes/*.STL"]

[tool.ruff]
line-length = 120
indent-width = 2  # mjlab's style
target-version = "py310"
extend-exclude = ["artifacts", "data", "docs", "logs", "wandb", "scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# s, l, n name the shear, lateral and normal unit loads of the bench data.
"src/scr_phybot_mjab/microspine/empirical_limit_surface.py" = ["E741"]
"src/scr_phybot_mjab/tools/microspine/*" = ["E741"]
"scripts/microspine/*" = ["E741"]
"tests/microspine/test_empirical_limit_surface.py" = ["E741"]
"tests/tools/test_microspine_first_failure.py" = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scripts", "docs", "data", "artifacts", "logs", "wandb", "scratch", "build"]
addopts = "-ra --strict-markers"
markers = ["gpu: needs a CUDA device"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
extraPaths = ["src"]

[[tool.ty.overrides]]
include = ["src/scr_phybot_mjab/tasks/climb_wall/climb_wall_env_cfg.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
