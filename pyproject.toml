[project]
name = "scr_phybot_mjab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["amp-rsl-rl==2.2.1", "mjlab", "trimesh>=4.0"]

[project.optional-dependencies]
teleop = ["hidapi>=0.14"]

[project.entry-points."mjlab.tasks"]
scr_phybot_mjab = "scr_phybot_mjab.tasks"

[project.scripts]
scr_phybot_mjab-train = "mjlab.scripts.train:main"
scr_phybot_mjab-play = "mjlab.scripts.play:main"
scr_phybot_mjab-list-envs = "mjlab.scripts.list_envs:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
extraPaths = ["src"]

[[tool.ty.overrides]]
include = ["src/scr_phybot_mjab/tasks/climb_wall/climb_wall_env_cfg.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
